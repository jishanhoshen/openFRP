# Relay host kernel tuning. TEMPLATE — not applied anywhere.
# Install on the relay only (after approval): /etc/sysctl.d/99-tunnelhub.conf
#
# UDP socket buffers: QUIC (quic-go) wants ~7.5 MB; the stock 208 KB causes
# drops under bursty UDP game traffic.
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000

# Backlog for bursts of new player connections.
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 8192
net.core.netdev_max_backlog = 16384

# Many concurrent relayed connections.
net.netfilter.nf_conntrack_max = 524288

# Better TCP throughput over long/lossy paths (player -> relay -> home).
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
